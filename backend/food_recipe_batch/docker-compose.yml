services:
  app:
    image: php:8.4-cli
    container_name: food_recipe_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    tty: true
    networks:
      - food_recipe_net
    ports: 
      - "8000:8000"

  db:
    image: postgres:16
    container_name: food_recipe_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: food_recipe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - food_recipe_net

networks:
  food_recipe_net:
    driver: bridge

volumes:
  db_data: